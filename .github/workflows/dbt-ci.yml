name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dbt-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install dbt-core==1.12.5 dbt-snowflake==1.12.1

      - name: Create CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          finance_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ci_account
                user: ci_user
                password: ci_password
                database: FINANCE_ANALYTICS
                schema: STAGING
                warehouse: FINANCE_BI_WH
                role: ACCOUNTADMIN
                threads: 4
          EOF

      - name: Check dbt project
        working-directory: finance_analytics
        run: |
          dbt parse